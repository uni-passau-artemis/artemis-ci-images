---
name: Build Image

on:
  workflow_call:
    inputs:
      subdir:
        required: true
        type: string
      image_name:
        required: true
        type: string
      base_image:
        required: false
        default: "base"
        type: string

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: artemis-${{ inputs.image_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    strategy:
      matrix:
        pipeline_helper: ["v2.3.1"]
        java_major_version: [25, 26, 27]
        include:
          - java_major_version: 25
            java_version: 25.0.4
            java_url: "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz"
          - java_major_version: 26
            java_version: 26.0.2
            java_url: "https://download.java.net/java/GA/jdk26.0.2/818d462d89b645c7a1aad49066c454e5/10/GPL/openjdk-26.0.2_linux-x64_bin.tar.gz"
          - java_major_version: 27
            java_version: 27.0.0
            java_url: "https://download.java.net/java/GA/jdk27/55ce5470a6294008af0057ff4626d0e5/35/GPL/openjdk-27_linux-x64_bin.tar.gz"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch pipeline-helper
        run: |
          wget -q -O ${{ inputs.subdir }}/pipeline-helper.jar https://github.com/uni-passau-artemis/pipeline-helper/releases/download/${{ matrix.pipeline_helper }}/pipeline-helper.jar

      # support multiple architectures
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4.4.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.4.0
        with:
          tags: |
            ghcr.io/uni-passau-artemis/${{ env.IMAGE_NAME }}:${{ matrix.java_major_version }}
            ghcr.io/uni-passau-artemis/${{ env.IMAGE_NAME }}:${{ matrix.java_version }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/artemis-${{ inputs.base_image }}:${{ matrix.java_version }}
            JAVA_VERSION=${{ matrix.java_version }}
            JDK_DOWNLOAD_URL=${{ matrix.java_url }}
            MAVEN_VERSION=3.9.16
          context: ${{ inputs.subdir }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
